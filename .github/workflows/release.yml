name: Release

# Push a tag like v0.2.0 to build the Windows .exe and publish a GitHub release.
# Run it manually (Actions → Release → Run workflow) to build the .exe as a downloadable
# artifact without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Test and build Windows .exe
    runs-on: windows-latest
    outputs:
      asset: ${{ steps.version.outputs.asset }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import amtoolkit; print(amtoolkit.__version__)")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match amtoolkit/__init__.py version $VERSION"
              exit 1
            fi
            LABEL="v$VERSION"
          else
            LABEL="v$VERSION-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=AccessManagerToolkit-$LABEL-windows-x64" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: pyinstaller --clean --noconfirm packaging/amtoolkit.spec

      - name: Smoke test executable
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $data = Join-Path $env:RUNNER_TEMP "amt-smoke"
          $proc = Start-Process -FilePath "dist\AccessManagerToolkit.exe" `
            -ArgumentList "--no-browser", "--port", "8799", "--data-dir", $data -PassThru
          $meta = $null
          for ($i = 0; $i -lt 60 -and -not $meta; $i++) {
            Start-Sleep -Seconds 1
            try { $meta = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/meta" } catch { }
          }
          $page = if ($meta) { Invoke-WebRequest -Uri "http://127.0.0.1:8799/static/app.js" -UseBasicParsing } else { $null }
          taskkill /PID $proc.Id /T /F | Out-Null
          if (-not $meta) { throw "The executable did not start serving within 60 seconds" }
          if ($meta.version -ne $env:EXPECTED_VERSION) { throw "Version mismatch: $($meta.version)" }
          if ($page.StatusCode -ne 200) { throw "Static UI files are missing from the executable" }
          if (-not (Test-Path (Join-Path $data "toolkit.db"))) { throw "Database was not created" }
          Write-Host "Smoke test passed: version $($meta.version)"

      - name: Package
        shell: pwsh
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\AccessManagerToolkit.exe" "out\$env:ASSET.exe"
          $hash = (Get-FileHash "out\$env:ASSET.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET.exe" | Out-File -Encoding ascii -NoNewline "out\$env:ASSET.exe.sha256"
          Get-Content "out\$env:ASSET.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.asset }}
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
          cat > notes.md <<'NOTES'
          ## Install (Windows)

          1. Download `AccessManagerToolkit-…-windows-x64.exe` below.
          2. Optional: verify it — in PowerShell run `Get-FileHash <file>.exe` and compare with the `.sha256` file.
          3. Double-click it. A console window opens and the toolkit opens in your browser at http://127.0.0.1:8765.
             Keep the console window open while you work; press Ctrl+C in it to stop.

          The executable is not code-signed, so Windows SmartScreen may show "Windows protected your PC".
          Choose **More info → Run anyway** if the file hash matches.

          Your jobs and audit log are stored in `%LOCALAPPDATA%\AccessManagerToolkit` and are kept when you
          upgrade to a newer version.
          NOTES
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Access Manager Toolkit $TAG" --notes-file notes.md --generate-notes $PRERELEASE
